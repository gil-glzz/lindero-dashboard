<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://collar-gps-server.onrender.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Lindero · Consola de pruebas de campo</title>
<meta name="theme-color" content="#0d1410">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1410; --panel:#141d16; --panel-2:#18241a; --border:#243425; --border-soft:#1c2a1e;
    --ink:#e8efe6; --ink-dim:#9db09c; --ink-faint:#6f836f;
    --accent:#4ade80; --accent-dim:#1f5236;
    /* estado (siempre con icono+etiqueta, nunca color solo) */
    --ok:#4ade80; --ok-wash:#12251a;
    --warn:#fbbf24; --warn-wash:#2a230d;
    --bad:#f87171; --bad-wash:#2a1615;
    --mute:#7b8a7c; --mute-wash:#1a221b;
    --signal:#38bdf8; --signal-wash:#0e2230;
    --mono:'Space Grotesk',ui-monospace,monospace;
    --sans:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
    --r:14px; --r-sm:9px;
    /* series de las gráficas (pestaña Energía): ranuras 1 y 2 de la paleta categórica para fondo oscuro, validadas
       contra --panel; nunca los colores de estado. */
    --serie-1:#3987e5; /* % de batería */
    --serie-2:#d95926; /* voltaje */
    /* CE2 (2026-10-15): franjas de /PGOOD por su clase. Panel en tinta neutra; cable (USB) en la ranura 3 (aqua) de la
       misma paleta, rayada y rotulada «USB». Validada contra --panel con las dos series, todas las parejas
       (validate_palette.js --mode dark --pairs all): CVD ΔE 9.4, visión normal 20.9, contraste ≥ 3:1. */
    --franja-panel:#e8efe614; --franja-panel-lleno:#e8efe628;
    --franja-usb:#199e70; --franja-usb-wash:#199e7026; --franja-usb-raya:#199e70a6;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(1200px 600px at 80% -10%, #12241a55, transparent);}
  h1,h2,h3{font-family:var(--mono); font-weight:600; margin:0}
  .mono{font-family:var(--mono)}
  a{color:inherit}

  /* ── Header ── */
  header{position:sticky; top:0; z-index:20; backdrop-filter:blur(10px);
    background:linear-gradient(#0d1410ee,#0d1410cc); border-bottom:1px solid var(--border);}
  .head-row{display:flex; align-items:center; gap:14px; padding:14px 20px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:11px; margin-right:auto}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#06130b;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:20px}
  .brand h1{font-size:16px; letter-spacing:-.01em}
  .brand .sub{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em}
  .conn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-dim);white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mute); box-shadow:0 0 0 3px #ffffff08}
  .dot.live{background:var(--ok); box-shadow:0 0 0 3px #4ade8022; animation:pulse 2s infinite}
  .dot.demo{background:var(--warn); box-shadow:0 0 0 3px #fbbf2422}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .btn{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink);background:var(--panel);border:1px solid var(--border);
    border-radius:9px;padding:8px 13px;cursor:pointer;white-space:nowrap;transition:.12s}
  .btn:hover{border-color:var(--accent-dim);background:var(--panel-2)}
  .btn.primary{background:var(--accent);color:#06130b;border-color:var(--accent);font-weight:600}
  .btn.sm{padding:5px 9px;font-size:11.5px;border-radius:7px}

  /* ── KPI stat tiles ── */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:0 20px 14px}
  .kpi{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--r);padding:13px 15px;position:relative;overflow:hidden}
  .kpi .k-lbl{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em}
  .kpi .k-val{font-family:var(--mono);font-size:29px;font-weight:600;line-height:1.05;margin-top:3px}
  .kpi .k-val small{font-size:.45em;color:var(--ink-faint);font-weight:500}
  .kpi.accent .k-val{color:var(--ok)} .kpi.warn .k-val{color:var(--warn)} .kpi.bad .k-val{color:var(--bad)} .kpi.mute .k-val{color:var(--ink-dim)}
  .kpi .k-edge{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border)}
  .kpi.accent .k-edge{background:var(--ok)} .kpi.warn .k-edge{background:var(--warn)} .kpi.bad .k-edge{background:var(--bad)} .kpi.mute .k-edge{background:var(--mute)}

  /* ── Layout ── */
  .wrap{padding:4px 20px 40px;display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  @media(max-width:1000px){ .wrap{grid-template-columns:1fr} }
  .toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar .sp{margin-left:auto}
  select,input{font-family:var(--sans);font-size:12.5px;color:var(--ink);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
  .section-title{font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;margin:0 2px 10px}

  /* ── Collar cards ── */
  /* min(…,100%): en un teléfono de 375 px la tarjeta de 340 px no cabía y la página se desplazaba de lado */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--r);padding:15px 16px 14px;position:relative;transition:.15s}
  .card:hover{border-color:var(--border)}
  .card.st-warn{box-shadow:inset 3px 0 0 var(--warn)} .card.st-bad{box-shadow:inset 3px 0 0 var(--bad)}
  .card.st-mute{opacity:.82;box-shadow:inset 3px 0 0 var(--mute)} .card.st-ok{box-shadow:inset 3px 0 0 var(--ok)}
  .c-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .c-name{font-family:var(--mono);font-weight:600;font-size:15px;line-height:1.1}
  .c-dev{font-size:11px;color:var(--ink-faint);margin-top:1px}
  .c-head .right{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
  .pill.ok{color:var(--ok);background:var(--ok-wash);border-color:#4ade8033}
  .pill.warn{color:var(--warn);background:var(--warn-wash);border-color:#fbbf2433}
  .pill.bad{color:var(--bad);background:var(--bad-wash);border-color:#f8717133}
  .pill.mute{color:var(--ink-dim);background:var(--mute-wash);border-color:#7b8a7c33}
  .pill.signal{color:var(--signal);background:var(--signal-wash);border-color:#38bdf833}
  /* CE2: clase de una sesión o de un día excluido, con el color de su franja (identidad, no estado) y su icono */
  .pill.usb{color:var(--ink);background:var(--franja-usb-wash);border-color:var(--franja-usb-raya)}
  .pill.panel{color:var(--ink);background:var(--franja-panel-lleno);border-color:var(--border)}
  .fw{font-size:10.5px;color:var(--ink-faint);font-family:var(--mono)}

  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin-bottom:11px}
  .m{min-width:0}
  .m .m-lbl{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:4px}
  .m .m-val{font-family:var(--mono);font-size:15px;font-weight:500;margin-top:1px}
  .m .m-val .q{font-size:10.5px;color:var(--ink-faint);font-weight:400;margin-left:3px}
  .m .m-val.ok{color:var(--ok)} .m .m-val.warn{color:var(--warn)} .m .m-val.bad{color:var(--bad)} .m .m-val.mute{color:var(--ink-dim)}

  /* meter bar */
  .meter{height:5px;border-radius:3px;background:#0000003d;overflow:hidden;margin-top:5px;border:1px solid #ffffff08}
  .meter > i{display:block;height:100%;border-radius:3px}

  /* sparkline */
  .spark{margin:2px 0 11px}
  .spark svg{display:block;width:100%;height:34px;overflow:visible}
  .spark-cap{font-size:10px;color:var(--ink-faint);display:flex;justify-content:space-between;margin-top:2px}

  .counters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{font-size:11px;color:var(--ink-dim);background:var(--panel-2);border:1px solid var(--border-soft);border-radius:7px;padding:3px 8px;display:inline-flex;gap:5px;align-items:center}
  .chip b{font-family:var(--mono);color:var(--ink);font-weight:600}
  .chip.hot b{color:var(--bad)} .chip.warm b{color:var(--warn)}

  .c-actions{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--border-soft);padding-top:11px}
  .verdict{display:flex;gap:6px;margin-left:auto}
  .vbtn{width:30px;height:28px;border-radius:7px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:13px;display:grid;place-items:center}
  .vbtn.ok.on{background:var(--ok-wash);border-color:#4ade8055;color:var(--ok)}
  .vbtn.bad.on{background:var(--bad-wash);border-color:#f8717155;color:var(--bad)}

  /* ── Timeline ── */
  .side{position:sticky;top:78px}
  .panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--r);padding:15px 16px}
  .tl{display:flex;flex-direction:column;gap:0}
  .ev{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
  .ev:last-child{border-bottom:none}
  .ev .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex-shrink:0;background:var(--panel-2);border:1px solid var(--border-soft)}
  .ev.bad .ic{background:var(--bad-wash);border-color:#f8717133} .ev.warn .ic{background:var(--warn-wash);border-color:#fbbf2433}
  .ev.ok .ic{background:var(--ok-wash);border-color:#4ade8033} .ev.info .ic{background:var(--signal-wash);border-color:#38bdf833}
  .ev .body{min-width:0;flex:1}
  .ev .t1{font-size:12.5px}
  .ev .t1 b{font-family:var(--mono);font-weight:600}
  .ev .t2{font-size:11px;color:var(--ink-faint);margin-top:1px}
  .empty{color:var(--ink-faint);font-size:12.5px;text-align:center;padding:26px 0}
  .foot{color:var(--ink-faint);font-size:11px;text-align:center;padding:22px 20px 8px}

  /* ── Pestañas (2026-10-13) ── */
  .tabs{display:flex;gap:2px;padding:0 20px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--border-soft)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--ink-dim);background:none;border:none;
    border-bottom:2px solid transparent;padding:9px 14px 8px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .tab:focus-visible{outline:2px solid var(--accent-dim);outline-offset:-3px;border-radius:7px 7px 0 0}
  .kpis{padding-top:12px}

  /* ── Pestaña Energía ── */
  .vista-pad{padding:14px 20px 40px}
  /* En el teléfono la cabecera con los KPI ocupaba más de media pantalla pegada arriba: ahí se desplaza con la página */
  @media(max-width:520px){ header{position:static} .vista-pad{padding:12px 14px 32px} .head-row,.tabs{padding-left:14px;padding-right:14px} }
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .seg button{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-dim);background:var(--panel);border:none;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .seg button+button{border-left:1px solid var(--border)}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
  .e-estado{font-size:12px;color:var(--ink-faint);white-space:nowrap}
  .e-nota{font-size:11.5px;color:var(--ink-faint);margin:-4px 2px 12px}
  .e-banner{background:var(--warn-wash);border:1px solid #fbbf2433;color:var(--ink);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
  .egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(560px,100%),1fr));gap:14px;transition:opacity .15s}
  .egrid.recargando{opacity:.55}
  .ecard{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--r);padding:15px 16px 14px;min-width:0}
  .ecard .c-head{margin-bottom:8px;flex-wrap:wrap}
  .e-hero{font-size:13px;color:var(--ink-dim);margin:0 0 4px}
  .e-hero b{color:var(--ink);font-family:var(--mono);font-weight:600}
  .pill.grande{font-size:13px;padding:4px 11px}
  .e-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px 12px;margin:12px 0 4px;padding:11px 0;border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft)}
  .e-stats .m-val{font-size:16px}
  .e-stats .m-sub{font-size:11px;color:var(--ink-faint);margin-top:1px}
  .e-aviso{font-size:11px;color:var(--warn);margin-top:2px}
  .est{font-family:var(--sans);font-size:9px;font-weight:600;letter-spacing:.05em;color:var(--ink-faint);border:1px solid var(--border);
    border-radius:4px;padding:0 3px;margin-left:5px;vertical-align:2px;text-decoration:none;cursor:help}
  .leyenda{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:11.5px;color:var(--ink-dim);margin:12px 0 2px}
  .leyenda span{display:inline-flex;align-items:center;gap:6px}
  .lk{display:inline-block;width:16px;height:2px;border-radius:1px;flex-shrink:0}
  .lk-pct{background:var(--serie-1)} .lk-mv{background:var(--serie-2)}
  .sw{display:inline-block;width:12px;height:10px;border-radius:2px;border:1px solid var(--border)}
  .sw-panel{background:var(--franja-panel-lleno)}
  .sw-usb{background:repeating-linear-gradient(45deg,var(--franja-usb-raya) 0 2px,var(--franja-usb-wash) 2px 5px);border-color:var(--franja-usb-raya)}
  .pt-ancla{display:inline-block;width:8px;height:8px;margin:0 1px;background:var(--ink);transform:rotate(45deg);border-radius:1px}
  .pt-ancla.hueca{background:transparent;border:1.5px solid var(--ink-dim)}
  .pt-fin{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-dim)}
  .graficas{position:relative;outline:none;border-radius:8px;min-height:300px}
  .graficas:focus-visible{box-shadow:0 0 0 2px var(--accent-dim)}
  .g-tit{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 0;display:flex;gap:7px;align-items:center}
  .graficas svg{display:block;max-width:100%;height:auto;touch-action:pan-y;overflow:visible}
  .eg text{font-family:var(--sans);font-size:10.5px;fill:var(--ink-faint);font-variant-numeric:tabular-nums}
  .eg .ty{text-anchor:end} .eg .tx{text-anchor:middle}
  .eg .vfin{fill:var(--ink);font-family:var(--mono);font-size:11.5px;font-weight:600}
  .eg .fr-t{fill:var(--ink);font-size:9.5px;font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
  .eg .gy,.eg .gx{stroke:var(--border-soft);stroke-width:1}
  .eg .gx.mayor,.eg .eje{stroke:var(--border)}
  .eg .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .eg .fin,.eg .cruz-pt{stroke:var(--panel);stroke-width:2}
  .eg .cruz{stroke:var(--ink-dim);stroke-width:1}
  .eg .hit{fill:transparent;cursor:crosshair}
  /* CE2: panel en tinta neutra; cable (USB) con su patrón rayado (el fill va en el atributo: ninguna regla de aquí
     puede ponerle fill a .fr-usb, porque el CSS le gana al atributo) */
  .eg .fr-panel{fill:var(--franja-panel)} .eg .fr-panel.fr-lleno{fill:var(--franja-panel-lleno)}
  .eg .fr-usb-fondo{fill:var(--franja-usb-wash)} .eg .fr-usb-raya{stroke:var(--franja-usb-raya);stroke-width:2}
  .eg .ancla{fill:var(--panel);stroke:var(--ink-dim);stroke-width:1.5}
  .eg .ancla.valida{fill:var(--ink);stroke:var(--panel);stroke-width:2}
  .tip{position:absolute;z-index:5;pointer-events:none;background:#0b120ef5;border:1px solid var(--border);border-radius:9px;
    padding:8px 10px;font-size:12px;min-width:160px;box-shadow:0 8px 24px #0009}
  .tip-t{font-size:11px;color:var(--ink-faint);margin-bottom:4px}
  .tip-r{display:flex;align-items:center;gap:7px;line-height:1.6}
  .tip-r b{font-family:var(--mono);font-weight:600;color:var(--ink);min-width:62px}
  .tip-r span{color:var(--ink-dim)}
  .tip-e{color:var(--ink-dim);margin-top:3px;border-top:1px solid var(--border-soft);padding-top:4px}
  details.e-det{margin-top:8px}
  details.e-det summary,details.e-como summary{cursor:pointer;font-size:12px;color:var(--ink-dim);padding:4px 0}
  details.e-det summary:hover,details.e-como summary:hover{color:var(--ink)}
  .e-sub{font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px;font-weight:600}
  .tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border-soft);border-radius:10px;max-width:100%}
  .tabla-scroll.alta{max-height:340px;overflow-y:auto}
  table.t{border-collapse:collapse;width:100%;font-size:12.5px}
  table.t-dias{min-width:960px} table.t-excl{min-width:620px} table.t-ses{min-width:760px}
  table.t .dia{position:sticky;left:0;z-index:1;white-space:nowrap;background:var(--panel);box-shadow:1px 0 0 var(--border-soft)}
  table.t th.dia{z-index:2;background:var(--panel-2)}
  table.t tr.en-curso td{background:var(--panel-2)}
  table.t ul.mot{margin:0;padding-left:15px;color:var(--ink-dim);font-size:12px} table.t ul.mot li{margin:1px 0}
  table.t .pill{font-size:11px;padding:2px 8px}
  .dicho,table.t td.dicho{color:var(--ink-faint)}
  .e-ahora{font-size:12px;color:var(--ink-dim);margin:10px 0 0;line-height:1.6}
  .e-ahora b{color:var(--ink);font-weight:600;margin-right:3px}
  .e-cosecha{margin-top:0;border-top:none;padding-top:2px}
  .nw{white-space:nowrap}
  /* En el teléfono los motivos de un día excluido no se leían en una columna de 100 px: cada día va en bloque
     (día y por qué arriba; motivos y anclas a todo lo ancho), sin desplazamiento de lado */
  @media(max-width:520px){
    table.t.t-excl{min-width:0} table.t.t-excl thead{display:none}
    table.t.t-excl tr{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 9px;border-bottom:1px solid var(--border-soft)}
    table.t.t-excl tr:last-child{border-bottom:none}
    table.t.t-excl td{display:block;padding:0;border:none}
    table.t.t-excl td.dia{position:static;box-shadow:none;background:none}
    table.t.t-excl td:nth-child(3),table.t.t-excl td:nth-child(4){grid-column:1 / -1}
    table.t.t-excl td.n{text-align:left}
  }
  table.t th{position:sticky;top:0;background:var(--panel-2);font-weight:600;font-size:11px;color:var(--ink-dim);text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:bottom}
  table.t th small{display:block;font-weight:500;color:var(--ink-faint);font-size:10px}
  table.t td{padding:7px 9px;border-bottom:1px solid var(--border-soft);vertical-align:top}

<script>
const API_BASE = 'https://collar-gps-server.onrender.com';
const UMBRAL_LINEA_MS = 5*60*1000;
let TOKEN = null, DEMO = false, AUTO = true, autoTimer = null;
let collares = [], eventos = [], veredictos = {};

// ── utilidades seguras ──
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:null;};
function haceTxt(ts){ if(!ts)return '—'; const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60)return `hace ${Math.round(s)}s`; if(s<3600)return `hace ${Math.round(s/60)} min`;
  if(s<86400)return `hace ${Math.round(s/3600)} h`; return `hace ${Math.round(s/86400)} d`; }
const enLinea=c=>c.ts && (Date.now()-c.ts)<UMBRAL_LINEA_MS;

// clasificación de estado (icono + etiqueta, nunca color solo)
function estadoCollar(c){
  if(!enLinea(c)) return {k:'mute', ic:'○', txt:'Sin señal'};
  if(c.estado==='shock') return {k:'bad', ic:'⛔', txt:'Fuera / cruce'};
  if(c.estado==='warn')  return {k:'warn',ic:'▲', txt:'Aviso'};
  return {k:'ok', ic:'●', txt:'Dentro'};
}
// calidades → nivel de estado
function nivelHdop(h){ if(h==null)return{k:'mute',q:''}; if(h<=1)return{k:'ok',q:'excelente'}; if(h<=2)return{k:'ok',q:'buena'}; if(h<=5)return{k:'warn',q:'regular'}; return{k:'bad',q:'mala'}; }
function nivelBat(b){ if(b==null)return{k:'mute'}; if(b>=50)return{k:'ok'}; if(b>=20)return{k:'warn'}; return{k:'bad'}; }
function pctRssi(r){ return r==null?0:clamp(Math.round((r+120)/90*100),0,100); }
function nivelRssi(r){ if(r==null)return{k:'mute',q:''}; if(r>-70)return{k:'ok',q:'fuerte'}; if(r>-100)return{k:'warn',q:'media'}; return{k:'bad',q:'débil'}; }
function pctSnr(s){ return s==null?0:clamp(Math.round((s+20)/30*100),0,100); }
function nivelSnr(s){ if(s==null)return{k:'mute',q:''}; if(s>=0)return{k:'ok',q:'buena'}; if(s>=-10)return{k:'warn',q:'media'}; return{k:'bad',q:'débil'}; }
const COLORK={ok:'var(--ok)',warn:'var(--warn)',bad:'var(--bad)',mute:'var(--mute)',signal:'var(--signal)'};

function meter(pct,k){ return `<div class="meter"><i style="width:${clamp(pct,0,100)}%;background:${COLORK[k]||COLORK.mute}"></i></div>`; }
function sparkline(vals,color){
  const v=vals.filter(x=>x!=null); if(v.length<2) return '<div class="spark" style="height:34px"></div>';
  const mn=Math.min(...v), mx=Math.max(...v), rg=(mx-mn)||1, W=100,H=30;
  const pts=vals.map((y,i)=>{ if(y==null)return null; const x=(i/(vals.length-1))*W; const yy=H-((y-mn)/rg)*H; return `${x.toFixed(1)},${yy.toFixed(1)}`; }).filter(Boolean).join(' ');
  const last=v[v.length-1];
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg><div class="spark-cap"><span>${vals.length} lecturas</span><span class="mono">${last}</span></div></div>`;
}

// ⟦ENERGIA-PURA⟧ inicio ─────────────────────────────────────────────────────────────────────────────
// Pestañas y pestaña «Energía» (bloque CE, 2026-10-13; CE2 «solo panel», 2026-10-15). Todo lo de esta región es PURO: no
//  toca el DOM ni la red, así la prueba (node tools/test_consola_energia.js) lo corre en un contexto vacío. Lo único de
//  fuera que usa es esc(). Contrato del servidor: GET /energia/balance, docs/testing/BLOQUE_CONSOLA_ENERGIA.md (D6 v2).
// CE2 (2026-10-15, Gilberto: «sí, corrige la consola así»): la pestaña contaba el USB como si fuera panel. Ahora contesta
//  solo dos preguntas: si con SOLO el panel se mantiene la batería (anclas de madrugada día contra día; los días con
//  cable salen aparte y no entran a nada) y qué tan bien rinde el panel (cosecha, sin corriente). La etiqueta `fuente`
//  del collar (IO44) ya no decide nada: sale como dato secundario, «el collar dice».
// Para AGREGAR UNA PESTAÑA: una entrada en VISTAS, un <section id="vista-ID" role="tabpanel" hidden> en el HTML y,
//  si carga datos, su caso en alMostrar() y tick(). La barra de pestañas se arma sola.
const VISTAS = Object.freeze([
  Object.freeze({ id:'collares', titulo:'Collares', icono:'▦' }),
  Object.freeze({ id:'energia',  titulo:'Energía',  icono:'⚡' }),
]);
const VISTA_POR_OMISION = 'collares';
const ENERGIA_RANGOS = Object.freeze([
  Object.freeze({ horas:24, txt:'24 h' }), Object.freeze({ horas:72, txt:'3 días' }), Object.freeze({ horas:168, txt:'7 días' }) ]);
const ENERGIA_HORAS_POR_OMISION = 168;
// La serie del servidor va en cubos de 5 min y la salud llega cada 15: pedir más seguido no trae nada nuevo (y cada
//  consulta le cuesta al servidor de Render, que tiene un solo hilo). Tras un error se reintenta al minuto.
const ENERGIA_REFRESCO_MS = 5*60*1000, ENERGIA_REINTENTO_MS = 60*1000;
// Revisión adversarial 2 (2026-10-14): datos con más de 10 min desde que los generó el servidor = «no son de ahora»
//  (el refresco normal es cada 5 min). Sin red, sw.js responde con la copia guardada y status 200.
const ENERGIA_VIEJO_MS = 10*60*1000;
const MARGEN_G = Object.freeze({ l:40, r:58, t:10, b:22 });   // px: eje Y a la izquierda, valor final a la derecha
// CE2-9 (2026-10-15): la versión del contrato que entiende esta pestaña (D6 v2). Una respuesta sin `version: 2` es del
//  servidor de antes (su veredicto contaba el USB como panel): se avisa «falta desplegar CE2» y no se muestra veredicto.
const ENERGIA_VERSION = 2;
const esV2 = r => !!r && typeof r==='object' && Number(r.version)===ENERGIA_VERSION;

// ── pestañas ──
// La pestaña al abrir: la del enlace (#energia) gana, luego la última elegida, luego la de omisión.
function vistaInicial(hash, guardada, vistas){
  const ids = (vistas||[]).map(v=>v.id), h = String(hash||'').replace(/^#/, '');
  if(ids.includes(h)) return h;
  if(ids.includes(guardada)) return guardada;
  return ids.includes(VISTA_POR_OMISION) ? VISTA_POR_OMISION : ids[0];
}
function htmlPestanas(vistas, activa){
  return vistas.map(v=>`<button type="button" class="tab" role="tab" id="tab-${v.id}" aria-controls="vista-${v.id}" `+
    `aria-selected="${v.id===activa}" tabindex="${v.id===activa?0:-1}" data-vista="${v.id}"><span aria-hidden="true">${v.icono}</span>${esc(v.titulo)}</button>`).join('');
}
function vistaVecina(vistas, actual, tecla){   // teclado de la barra (patrón «tabs» de WAI-ARIA)
  const n = vistas.length, i = Math.max(0, vistas.findIndex(v=>v.id===actual));
  if(tecla==='ArrowRight') return vistas[(i+1)%n].id;
  if(tecla==='ArrowLeft')  return vistas[(i-1+n)%n].id;
  if(tecla==='Home') return vistas[0].id;
  if(tecla==='End')  return vistas[n-1].id;
  return null;
}
function horasValidas(h){ const n = Number(h); return ENERGIA_RANGOS.some(r=>r.horas===n) ? n : ENERGIA_HORAS_POR_OMISION; }
function htmlRangos(rangos, horas){
  return rangos.map(r=>`<button type="button" data-horas="${r.horas}" aria-pressed="${r.horas===horas}">${esc(r.txt)}</button>`).join('');
}

// ── formatos (es-MX: «1,528» y «4.7») ──
const esNum = v => v!=null && v!=='' && typeof v!=='boolean' && Number.isFinite(Number(v));
function fmtNum(v, dec=1){ return esNum(v) ? Number(v).toLocaleString('es-MX', { minimumFractionDigits:dec, maximumFractionDigits:dec }) : '—'; }
function fmtSigno(v, dec=1){   // con signo; el menos es el signo tipográfico (−), no el guion
  if(!esNum(v)) return '—';
  const r = Number(Number(v).toFixed(dec)), s = fmtNum(Math.abs(r), dec);
  return r>0 ? '+'+s : r<0 ? '−'+s : s;
}
function fmtV(mv, dec=3){ return esNum(mv) && Number(mv)>0 ? (Number(mv)/1000).toFixed(dec)+' V' : '—'; }
// mV con signo: entero sin decimales («+65 mV»), con medio mV con uno («+55.5 mV»).
function fmtMv(v){ return esNum(v) ? fmtSigno(v, Number.isInteger(Number(v)) ? 0 : 1)+' mV' : '—'; }
function fmtMin(m){   // 672 → «11 h 12 min»; 235 → «3 h 55 min»; 40 → «40 min»
  if(!esNum(m)) return '—';
  const n = Math.max(0, Math.round(Number(m))), h = Math.floor(n/60), r = n%60;
  return h ? (r ? `${h} h ${r} min` : `${h} h`) : `${r} min`;
}
function fmtFraccion(f){ return esNum(f) ? fmtNum(Number(f)*100, 0)+' %' : '—'; }
const esPar = v => Array.isArray(v) && v.length===2 && v.every(esNum);
function fmtIC(ic, unidad=' mV'){ return esPar(ic) ? `${fmtSigno(ic[0])} a ${fmtSigno(ic[1])}${unidad}` : '—'; }
function fmtMah(m){ return esPar(m) ? `${fmtSigno(m[0],0)} a ${fmtSigno(m[1],0)}` : '—'; }
function haceDesde(ts, ahora){
  const t = typeof ts==='number' ? ts : Date.parse(ts);
  if(!Number.isFinite(t)) return '—';
  const s = Math.max(0, (ahora-t)/1000);
  if(s<60) return `hace ${Math.round(s)} s`;
  if(s<3600) return `hace ${Math.round(s/60)} min`;
  if(s<86400) return `hace ${fmtNum(s/3600, s<36000?1:0)} h`;
  return `hace ${fmtNum(s/86400, 1)} días`;
}
const _FORMATOS = {};
function fmtTiempo(t, zona, tipo){
  const k = zona+'|'+tipo;
  if(!_FORMATOS[k]){
    const o = tipo==='dia' ? { weekday:'short', day:'numeric' } : tipo==='hora' ? { hour:'2-digit', minute:'2-digit', hourCycle:'h23' }
            : tipo==='fecha' ? { weekday:'short', day:'numeric', month:'short' }
            : { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23' };
    try{ _FORMATOS[k] = new Intl.DateTimeFormat('es-MX', { timeZone:zona, ...o }); }
    catch(e){ _FORMATOS[k] = new Intl.DateTimeFormat('es-MX', o); }   // zona desconocida: la del navegador
  }
  return _FORMATOS[k].format(t);
}
function fmtHora(t, zona){ return esNum(t) ? fmtTiempo(Number(t), zona, 'hora') : '—'; }
function fmtFecha(fecha){   // 'AAAA-MM-DD' (día local que ya calculó el servidor) → 'mar 13 de oct'
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(fecha||''));
  return m ? fmtTiempo(Date.UTC(+m[1], +m[2]-1, +m[3], 12), 'UTC', 'fecha') : String(fecha||'—');
}
// La medianoche local en o antes de t (las líneas de los días en la gráfica). Antes salía de `dias[].desde` (el día de
//  calendario del contrato viejo); en D6 v2 los días van de ancla a ancla y ya no traen medianoche: se saca de la zona.
const _PARTES = {};
function medianocheLocal(t, zona){
  if(!esNum(t)) return null;
  if(!_PARTES[zona]){
    const o = { hourCycle:'h23', hour:'2-digit', minute:'2-digit', second:'2-digit' };
    try{ _PARTES[zona] = new Intl.DateTimeFormat('en-US', { timeZone:zona, ...o }); }
    catch(e){ _PARTES[zona] = new Intl.DateTimeFormat('en-US', o); }
  }
  const n = Number(t), p = {};
  for(const x of _PARTES[zona].formatToParts(n)) p[x.type] = Number(x.value);
  return n - (((p.hour%24)*60 + p.minute)*60 + p.second)*1000 - ((n%1000)+1000)%1000;
}
// Parámetros de la respuesta, con el valor de D6 v2 si faltan (servidor raro): los textos nunca dicen «undefined».
function par(r, k, def){ return r && esNum(r[k]) ? Number(r[k]) : def; }
function parPar(r, k, def){ return r && esPar(r[k]) ? r[k].map(Number) : def; }
function mesetasDe(r){
  const m = r && r.mesetas_mv;
  return Array.isArray(m) && m.length && m.every(esPar) ? m.map(x=>x.map(Number)) : [[3660,3920],[4020,4050]];
}
// La marca ESTIMADO sale de la lista `estimados` de la respuesta, no de una lista propia.
function etqEst(r, campo){
  if(!(r && Array.isArray(r.estimados) && r.estimados.includes(campo))) return '';
  const m = parPar(r, 'mah_por_mv', [8,40]);
  return `<abbr class="est" title="${esc(`ESTIMADO: el IC lleva ±${fmtNum(par(r,'sistematica_mv',2),0)} mV de dispersión de un día a otro `+
    `y los mAh salen de ${fmtNum(m[0],0)}–${fmtNum(m[1],0)} mAh por mV, sin medir`)}">ESTIMADO</abbr>`;
}
function textoNotaEnergia(r){
  // R6 (revisión adversarial, 2026-10-15): sin v2 (servidor de antes o más nuevo) no hay veredicto «solo panel».
  if(!esV2(r)) return `Sin veredicto «solo panel» con esta respuesta: solo se muestra la batería · se actualiza cada `+
    `${Math.round(ENERGIA_REFRESCO_MS/60000)} min`;
  const m = parPar(r, 'mah_por_mv', [8,40]);
  return `Solo panel: los días con cable (USB) no cuentan · ancla = voltaje crudo antes del amanecer · mAh ESTIMADOS `+
    `(${fmtNum(m[0],0)}–${fmtNum(m[1],0)} mAh por mV) · días locales de ${(r && r.zona) || '—'} · se actualiza cada `+
    `${Math.round(ENERGIA_REFRESCO_MS/60000)} min`;
}
// «Cómo se calcula», con los números de la respuesta (sin respuesta, los de D6 v2). Solo números formateados y texto fijo.
function htmlComo(r){
  const sol = par(r,'sol_umbral_grados',-0.5), esc45 = par(r,'escalon_usb_mv',45), ev = parPar(r,'escalon_ventanas_min',[15,3]);
  const buscar = par(r,'escalon_buscar_min',60);
  const av = parPar(r,'ancla_ventana_min',[-60,-10]), amin = par(r,'ancla_min_reportes',15), cab = par(r,'cable_antes_h',12);
  const hueco = par(r,'hueco_cable_min',60), sis = par(r,'sistematica_mv',2), B = par(r,'bootstrap_b',2000);
  const mah = parPar(r,'mah_por_mv',[8,40]), dmin = par(r,'dias_tendencia_min',5), ss = par(r,'sin_subir_mv',3);
  const V = mv => (mv/1000).toFixed(2);
  return [
    `<b>Panel o cable.</b> Cada tramo con /PGOOD (cargando o alimentado) es <b>cable (USB)</b> si tuvo /PGOOD con el sol a menos de `+
      `${fmtSigno(sol)}°, un escalón de subida de ${fmtNum(esc45,0)} mV o más al conectar (mediana de los ${fmtNum(ev[0],0)} min de antes, `+
      `a batería, contra los primeros ${fmtNum(ev[1],0)} min; tras un hueco se buscan hasta ${fmtNum(buscar,0)} min atrás), si el cargador `+
      `terminó (alimentado sin cargar: con panel nunca ha pasado) o si el collar se reinició (grabado). Si no se vio cómo empezó (hueco `+
      `largo o el principio de los datos), cuenta como <b>posible cable</b>: su día no vale y sale «sin datos». Si no, es <b>panel</b>. `+
      `Un panel puesto a pleno sol podría dar el escalón (sin medir): ese motivo lo dice. Lo que dice el collar (IO44) no decide: al `+
      `sol dice «USB» casi siempre.`,
    `<b>Ancla.</b> La mediana del voltaje crudo a batería entre ${fmtNum(-av[0],0)} y ${fmtNum(-av[1],0)} min antes de la salida del sol `+
      `(${fmtNum(amin,0)} reportes o más): la celda ya asentada y a la misma hora cada día. Δ = ancla del día siguiente − ancla del día.`,
    `<b>Qué días cuentan.</b> Ni un minuto de cable desde ${fmtNum(cab,0)} h antes del ancla hasta el ancla del día siguiente, ningún `+
      `hueco de más de ${fmtNum(hueco,0)} min (podría esconder un cable), algún minuto de panel y las dos anclas. Los demás salen en `+
      `«Días excluidos» con su motivo y no entran a ningún promedio.`,
    `<b>Veredicto del día.</b> IC95 de Δ por bootstrap (${fmtNum(B,0)} remuestras con semilla fija: misma entrada, misma salida) `+
      `± ${fmtNum(sis,0)} mV de dispersión de un día a otro (ESTIMADO): <b>sube</b> si el IC queda arriba de 0, <b>baja</b> si queda `+
      `abajo y <b>no se distingue de cero</b> si lo cruza: eso no quiere decir que el panel alcance, el IC dice cuánto podría faltar `+
      `o sobrar. Si un ancla cae en una meseta de la celda, un Δ que no se distingue de cero no dice nada: <b>meseta, no se puede decir</b>.`,
    `<b>Tendencia y veredicto de arriba.</b> Recta por las anclas de los días válidos (pendiente común si hay tramos separados por `+
      `días excluidos), en mV/día ± IC95; con menos de 3 anclas, «faltan días». Con ${fmtNum(dmin,0)} días válidos o más el veredicto `+
      `sale de la tendencia; con menos, del promedio de los días, marcado «provisional».`,
    `<b>Cosecha del panel</b>, sin medir corriente: minutos con /PGOOD de panel, primera y última hora, fracción de las horas de sol `+
      `con panel, subida del voltaje (mediana de los últimos 15 min de panel − la de los primeros 15), máximo (mediana de 15 min) y `+
      `<b>cargando sin subir</b>: el tramo del inicio en que la mediana de 15 min no sube más de ${fmtNum(ss,0)} mV (sombra o panel débil).`,
    `<b>mAh ESTIMADOS</b>, solo como rango de ${fmtNum(mah[0],0)} a ${fmtNum(mah[1],0)} mAh por mV: la curva de BAT1 no describe esta `+
      `celda. En las mesetas (${mesetasDe(r).map(m=>`${V(m[0])}–${V(m[1])} V`).join(' y ')}) un día de consumo mueve pocos mV: no se `+
      `dan mAh y sale un aviso.`,
    `El <b>%</b> de la gráfica sigue siendo BAT1 por voltaje; las franjas dicen panel o cable según la primera regla.`,
  ].map(t=>`<li>${t}</li>`).join('');
}

// ── antigüedad, rango y versión de lo que se ve (revisión adversarial 2, 2026-10-14; CE2-9, 2026-10-15) ──
// La hora de los datos es la del servidor (`generado`), no la del fetch: sin red, sw.js entrega la copia guardada
//  con status 200 y antes la pestaña decía «datos de hace 0 s» aunque fuera de hace horas. Sin `generado`, la del fetch.
function tsDeRespuesta(d, respaldo){ const t = Date.parse(d && d.generado); return Number.isFinite(t) ? t : respaldo; }
function textoRango(h){ const r = ENERGIA_RANGOS.find(x=>x.horas===Number(h)); return r ? r.txt : `${fmtNum(h,0)} h`; }
function textoFaltaCE2(version){
  return esNum(version) && Number(version) > ENERGIA_VERSION
    ? `El servidor responde la versión ${fmtNum(version,0)} del balance y esta consola entiende la ${ENERGIA_VERSION}: recarga la página.`
    : 'El servidor todavía responde el balance de antes (sin «version: 2»): falta desplegar CE2. Hasta entonces no hay veredicto '+
      '«solo panel»; el de antes contaba el USB como si fuera panel. Solo se muestra la batería.';
}
// o: { error, hayDatos, ts, cache, horasDatos, horasPedidas, cargando, ahora, zona, version }. cache = la respuesta trajo
//  X-Lindero-Cache (la copia del service worker, sin red). Devuelve los avisos (texto plano; se escapan al pintar).
function avisosEnergia(o){
  const out = [], hace = haceDesde(o.ts, o.ahora);
  if(o.hayDatos && !esV2({ version:o.version })) out.push(textoFaltaCE2(o.version));   // CE2-9
  // Si falló el cambio de rango (7 días → 24 h con 500/429/sin red), el botón marca lo pedido (es lo que se reintenta)
  //  y aquí se dice de qué rango son los datos que se ven.
  const otroRango = !!o.hayDatos && esNum(o.horasDatos) && Number(o.horasDatos)!==Number(o.horasPedidas);
  const queSeVe = otroRango ? `Se muestran los datos de ${textoRango(o.horasDatos)} (${hace}), no los de ${textoRango(o.horasPedidas)}.`
                            : `Se muestra lo de ${hace}.`;
  if(o.error) out.push(o.hayDatos ? `${o.error} ${queSeVe}` : String(o.error));
  else if(otroRango && !o.cargando) out.push(queSeVe);
  if(!o.error && o.hayDatos){
    const cuando = esNum(o.ts) ? ` (los generó el servidor el ${fmtTiempo(o.ts, o.zona||'UTC', 'completa')})` : '';
    if(o.cache) out.push(`Sin conexión: se muestran datos guardados de ${hace}${cuando}. No son de ahora.`);
    else if(esNum(o.ts) && o.ahora - o.ts > ENERGIA_VIEJO_MS) out.push(`Los datos son de ${hace}${cuando}: no son de ahora.`);
  }
  return out;
}
function textoEstadoEnergia(o){
  const otroRango = !!o.hayDatos && esNum(o.horasDatos) && Number(o.horasDatos)!==Number(o.horasPedidas);
  if(o.cargando) return 'Actualizando…' + (otroRango ? ` (se ven los de ${textoRango(o.horasDatos)})` : '');
  if(!o.hayDatos) return o.error ? '⚠ sin datos' : '—';
  const viejo = esNum(o.ts) && o.ahora - o.ts > ENERGIA_VIEJO_MS;
  return `${o.error ? '⚠ sin actualizar · ' : o.cache ? '⚠ sin conexión · ' : viejo ? '⚠ ' : ''}datos${o.cache ? ' guardados' : ''} de ${haceDesde(o.ts, o.ahora)}`;
}

// ── estados (icono + etiqueta; el color de estado nunca va solo) ──
// CE2-4/CE2-7: el veredicto «solo panel» de un día o del resumen (D6 v2).
// Revisión adversarial de CE2 (2026-10-15): «igual» se pintaba «= Se mantiene con solo panel», que contesta que sí a la
//  pregunta de Gilberto cuando el IC solo dice que Δ no se distingue de cero (R3: con −7 a +2 mV el panel podía quedarse
//  corto ~280 mAh por día; el texto del servidor trae el IC). «meseta» es un «igual» con un ancla en una meseta de la
//  celda, donde Δ ≈ 0 no dice nada (R1).
const VEREDICTOS = Object.freeze({
  sube:     Object.freeze({ k:'ok',     ic:'▲', txt:'Sube con solo panel',       corto:'Sube' }),
  igual:    Object.freeze({ k:'signal', ic:'≈', txt:'No se distingue de cero',   corto:'No se distingue' }),
  baja:     Object.freeze({ k:'warn',   ic:'▼', txt:'Baja con solo panel',       corto:'Baja' }),
  meseta:   Object.freeze({ k:'mute',   ic:'▬', txt:'Meseta: no se puede decir', corto:'Meseta' }),
  sin_dias: Object.freeze({ k:'mute',   ic:'○', txt:'Faltan días',               corto:'Faltan días' }),
});
const veredictoDe = v => VEREDICTOS[v] || VEREDICTOS.sin_dias;
// CE2-1: la clase de una sesión de /PGOOD (y de su franja), la que calcula el servidor. Nunca la de IO44.
const CLASES = Object.freeze({
  panel: Object.freeze({ ic:'☀', txt:'Panel',       largo:'panel',       pill:'panel' }),
  usb:   Object.freeze({ ic:'🔌', txt:'Cable (USB)', largo:'cable (USB)', pill:'usb' }),
});
const claseDe = f => CLASES[f] || null;
function cargadorDe(c){   // carga: 0 alimentado, 1 cargando, 2 a batería
  const n = esNum(c) ? Number(c) : null;
  return n===1 ? { ic:'⚡', txt:'Cargando' } : n===0 ? { ic:'✓', txt:'Alimentado (sin cargar)' } : n===2 ? { ic:'🔋', txt:'A batería' } : { ic:'·', txt:'Sin dato' };
}
// CE2-5: lo que dice el collar (IO44) es solo un dato secundario. `fuente_texto` es texto del servidor (se escapa).
function dichoDelCollar(a){
  if(a && a.fuente_texto) return esc(a.fuente_texto);
  const f = a && esNum(a.fuente) ? Number(a.fuente) : null;
  return f===1 ? 'panel' : f===2 ? 'USB' : f===0 ? 'ninguna' : 'sin dato';
}

// ── la serie ──
function valorDe(p, campo){   // pct −1 = sin celda (mv null): no es un valor
  if(!p) return null;
  if(campo==='pct') return esNum(p.pct) && Number(p.pct)>=0 ? Number(p.pct) : null;
  return esNum(p.mv) && Number(p.mv)>0 ? Number(p.mv) : null;
}
// La serie llega decimada a `paso_min`: dos puntos seguidos pueden quedar hasta un paso más lejos de lo que estaban
//  los cubos. Por eso el corte es hueco_max_min + paso_min (35 min a 24 h, 50 a 7 días); un hueco de verdad (gateway
//  caído horas) se corta siempre.
function huecoSerieMs(r){
  const h = esNum(r && r.hueco_max_min) ? Number(r.hueco_max_min) : 30, p = esNum(r && r.paso_min) ? Number(r.paso_min) : 5;
  return (h + p) * 60e3;

function segmentosDe(serie, campo, maxGapMs){
  const segs = []; let cur = null, tPrev = null;
  for(const p of serie||[]){
    const v = valorDe(p, campo);
    if(v==null || !esNum(p.t)){ cur = null; continue; }   // sin celda: también corta la línea
    if(!cur || p.t - tPrev > maxGapMs){ cur = []; segs.push(cur); }
    cur.push({ t:p.t, v }); tPrev = p.t;
  }
  return segs;
}
function indiceCercano(serie, t){
  const n = (serie||[]).length; if(!n) return -1;
  let lo = 0, hi = n-1;
  while(lo<hi){ const m = (lo+hi)>>1; if(serie[m].t < t) lo = m+1; else hi = m; }
  return lo>0 && Math.abs(serie[lo-1].t - t) <= Math.abs(serie[lo].t - t) ? lo-1 : lo;
}
function franjaEn(franjas, t){ return (franjas||[]).find(f=>t>=f.desde && t<=f.hasta) || null; }
// CE2-3: las anclas de madrugada para la gráfica del voltaje, una por madrugada (por su salida del sol). `valida` = la
//  usa algún día válido; las demás son de días excluidos o del día en curso (se dibujan huecas).
function anclasDe(c){
  const m = new Map();
  const poner = (a, valida) => {
    if(!a || !esNum(a.mv) || !esNum(a.desde) || !esNum(a.hasta)) return;
    const k = esNum(a.salida) ? Number(a.salida) : Number(a.desde), x = m.get(k);
    if(x){ x.valida = x.valida || valida; return; }
    m.set(k, { t:(Number(a.desde)+Number(a.hasta))/2, mv:Number(a.mv), n:a.n, desde:Number(a.desde), hasta:Number(a.hasta),
               salida:esNum(a.salida) ? Number(a.salida) : null, valida });
  };
  for(const d of (c && c.dias)||[]){ poner(d.ancla, true); poner(d.ancla_siguiente, true); }
  for(const x of (c && c.excluidos)||[]){ poner(x.ancla, false); poner(x.ancla_siguiente, false); }
  if(c && c.en_curso) poner(c.en_curso.ancla, false);
  return [...m.values()].sort((a,b)=>a.t-b.t);
}
function anclaEn(anclas, t, tol=0){ return (anclas||[]).find(a=>t>=a.desde-tol && t<=a.hasta+tol) || null; }
function pasoLimpio(rango, n){
  const crudo = rango/Math.max(1,n), e = Math.pow(10, Math.floor(Math.log10(crudo))), f = crudo/e;
  return (f<=1 ? 1 : f<=2 ? 2 : f<=5 ? 5 : 10) * e;
}
// % fijo de 0 a 100 (se compara de un vistazo entre collares); el voltaje se acerca a los datos (y a las anclas) con un
//  margen, con un mínimo de 100 mV para que el ruido de ±7 mV no parezca una montaña.
function dominioDe(serie, campo, extra){
  if(campo==='pct') return { v0:0, v1:100, paso:25 };
  const vs = (serie||[]).map(p=>valorDe(p,'mv')).filter(v=>v!=null).concat((extra||[]).filter(v=>esNum(v) && v>0).map(Number));
  if(!vs.length) return { v0:3400, v1:4200, paso:200 };
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if(hi-lo < 100){ const c = (lo+hi)/2; lo = c-50; hi = c+50; }
  const pad = (hi-lo)*0.04; lo -= pad; hi += pad;
  const paso = pasoLimpio(hi-lo, 4);
  return { v0:Math.floor(lo/paso)*paso, v1:Math.ceil(hi/paso)*paso, paso };
}
function ticksY(dom){
  const out = [];
  for(let k = 0; dom.v0 + k*dom.paso <= dom.v1 + dom.paso*1e-6; k++) out.push(Math.round((dom.v0 + k*dom.paso)*1000)/1000);
  return out;
}
function geometria({ desde, hasta, ancho, alto, dom, m = MARGEN_G }){
  const x0 = m.l, x1 = Math.max(m.l+20, ancho-m.r), y0 = m.t, y1 = Math.max(m.t+20, alto-m.b);
  const span = Math.max(1, hasta-desde), rango = (dom.v1-dom.v0) || 1;
  return { x0, x1, y0, y1, desde, hasta, ancho, alto, v0:dom.v0, v1:dom.v1,
    x: t => x0 + (t-desde)/span*(x1-x0), y: v => y1 - (v-dom.v0)/rango*(y1-y0), t: px => desde + (px-x0)/(x1-x0)*span };
}
// Marcas de tiempo alineadas a la medianoche local (medianocheLocal: sin horario de verano, sumar horas basta). El paso
//  sale del ancho: una etiqueta cada ≥ 50 px («mié 14» mide ~36).
function ticksTiempo({ desde, hasta, medianoche, anchoPlot, zona }){
  const H = 3600e3, span = (hasta-desde)/H, caben = Math.max(2, Math.floor(anchoPlot/50));
  const paso = [1,2,3,6,12,24,48,72].find(p=>span/p <= caben) || 168;
  const base = esNum(medianoche) ? Number(medianoche) : Math.floor(desde/H)*H;
  const out = [];
  for(let k = Math.ceil((desde-base)/(paso*H)); base + k*paso*H <= hasta; k++){
    const t = base + k*paso*H, mayor = Math.round((t-base)/H) % 24 === 0;
    out.push({ t, mayor, etiqueta: fmtTiempo(t, zona, mayor ? 'dia' : 'hora') });
  }
  // Si las etiquetas van cada 2 o 3 días (teléfono), cada medianoche lleva igual su línea, sin texto: así se ven los días.
  if(paso > 24) for(let k = Math.ceil((desde-base)/(24*H)); base + k*24*H <= hasta; k++){
    const t = base + k*24*H; if(!out.some(o=>o.t===t)) out.push({ t, mayor:true, etiqueta:'' });
  }
  return out.sort((a,b)=>a.t-b.t);
}

// ── las gráficas (SVG propio; la CSP no deja scripts de fuera) ──
const r1 = v => Math.round(v*10)/10;
const idSeguro = s => String(s).replace(/[^A-Za-z0-9_-]/g, '_');
// CE2-9: las franjas dicen «panel» (tinta neutra) o «cable (USB)» (rayada, en la ranura 3 de la paleta: se distingue de
//  las dos series y no depende solo del color: rayas y rótulo). En el voltaje, las anclas de madrugada (◆ las de días
//  válidos, ◇ las demás).
function svgGrafica({ campo, serie, franjas, anclas, geo, dom, ticksX, maxGapMs, etiqueta, titulo, idRayas }){
  const W = geo.ancho, H = geo.alto, color = campo==='pct' ? 'var(--serie-1)' : 'var(--serie-2)';
  const fmtY = campo==='pct' ? v=>fmtNum(v,0) : v=>(v/1000).toFixed(dom.paso>=100 ? 1 : 2);
  const p = [`<svg class="eg" data-campo="${campo}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)}">`];
  if((franjas||[]).some(f=>f.fuente==='usb'))
    p.push(`<defs><pattern id="${idRayas}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">`+
      `<rect class="fr-usb-fondo" width="6" height="6"/><line class="fr-usb-raya" x1="1" y1="0" x2="1" y2="6"/></pattern></defs>`);
  for(const fr of franjas||[]){   // franjas de /PGOOD por su clase (CE2-1), detrás de todo
    const a = Math.max(geo.x0, geo.x(fr.desde)), b = Math.min(geo.x1, geo.x(fr.hasta));
    if(!(b > a)) continue;
    const usb = fr.fuente==='usb';
    p.push(`<rect class="fr ${usb ? 'fr-usb' : 'fr-panel'}${fr.estado==='alimentado' ? ' fr-lleno' : ''}" x="${r1(a)}" y="${geo.y0}" `+
      `width="${r1(Math.max(1, b-a))}" height="${geo.y1-geo.y0}"${usb ? ` fill="url(#${idRayas})"` : ''}/>`);
    if(usb && b-a >= 28) p.push(`<text class="fr-t" x="${r1(a+4)}" y="${geo.y0+11}">USB</text>`);
  }
  for(const v of ticksY(dom)){
    const y = r1(geo.y(v));
    p.push(`<line class="gy" x1="${geo.x0}" x2="${geo.x1}" y1="${y}" y2="${y}"/><text class="ty" x="${geo.x0-6}" y="${r1(y+3.5)}">${fmtY(v)}</text>`);
  }
  for(const tk of ticksX){
    const x = r1(geo.x(tk.t));
    p.push(`<line class="gx${tk.mayor ? ' mayor' : ''}" x1="${x}" x2="${x}" y1="${geo.y0}" y2="${geo.y1}"/>`+
      (tk.etiqueta ? `<text class="tx" x="${x}" y="${H-6}">${esc(tk.etiqueta)}</text>` : ''));
  }
  p.push(`<line class="eje" x1="${geo.x0}" x2="${geo.x1}" y1="${geo.y1}" y2="${geo.y1}"/>`);
  const segs = segmentosDe(serie, campo, maxGapMs);
  for(const s of segs){
    if(s.length===1){ p.push(`<circle class="ln-pt" cx="${r1(geo.x(s[0].t))}" cy="${r1(geo.y(s[0].v))}" r="1.6" fill="${color}"/>`); continue; }
    p.push(`<polyline class="ln" stroke="${color}" points="${s.map(q=>r1(geo.x(q.t))+','+r1(geo.y(q.v))).join(' ')}"/>`);
  }
  for(const an of anclas||[]){   // rombos de 10 px sobre la línea, con anillo del color del panel
    if(an.t < geo.desde || an.t > geo.hasta) continue;
    const x = r1(geo.x(an.t)), y = r1(geo.y(an.mv)), s = 5;
    p.push(`<path class="ancla${an.valida ? ' valida' : ''}" data-t="${an.t}" data-mv="${an.mv}" `+
      `d="M${x} ${r1(y-s)}L${r1(x+s)} ${y}L${x} ${r1(y+s)}L${r1(x-s)} ${y}Z"/>`);
  }
  const uS = segs[segs.length-1], ult = uS ? uS[uS.length-1] : null;
  if(ult){   // el último dato: punto resaltado y su valor, en tinta (no en el color de la serie)
    const x = r1(geo.x(ult.t)), y = r1(geo.y(ult.v));
    p.push(`<circle class="fin" cx="${x}" cy="${y}" r="4" fill="${color}"/>`+
      `<text class="vfin" x="${r1(x+8)}" y="${r1(Math.min(geo.y1, Math.max(geo.y0+8, y+4)))}">${esc(etiqueta(ult.v))}</text>`);
  }
  // La retícula del cursor (la mueve el pegamento) y la zona que recibe el puntero: todo el alto, no solo la línea.
  p.push(`<line class="cruz" x1="0" x2="0" y1="${geo.y0}" y2="${geo.y1}" visibility="hidden"/>`+
    `<circle class="cruz-pt" cx="0" cy="0" r="4" fill="${color}" visibility="hidden"/>`+
    `<rect class="hit" x="${geo.x0}" y="0" width="${r1(geo.x1-geo.x0)}" height="${H}"/></svg>`);
  return p.join('');
}
const GRAFICAS = Object.freeze([
  Object.freeze({ campo:'pct', alto:150, titulo:'% de batería (BAT1, por voltaje)', etq: v=>fmtNum(v,0)+' %' }),
  Object.freeze({ campo:'mv',  alto:140, titulo:'Voltaje de la celda',              etq: v=>fmtV(v) }),
]);
// Sin `version: 2` (servidor de antes) se dibuja solo la batería: sus franjas salían de IO44 y no se muestran.
function htmlGraficas(dev, c, r, ancho){
  const serie = (c && c.serie) || [];
  if(!serie.some(p=>valorDe(p,'pct')!=null || valorDe(p,'mv')!=null))
    return { html:'<p class="empty">Sin lecturas de batería en esta ventana.</p>', geos:null };
  const v2 = esV2(r), franjas = v2 ? (c.franjas||[]) : [], anclas = v2 ? anclasDe(c) : [];
  const desde = Date.parse(r.desde), hasta = Date.parse(r.generado), medianoche = medianocheLocal(desde, r.zona);
  const enVentana = anclas.filter(a=>a.t>=desde && a.t<=hasta);

    const conAnclas = g.campo==='mv';

    const geo = geometria({ desde, hasta, ancho, alto:g.alto, dom });
    const vals = serie.map(p=>valorDe(p, g.campo)).filter(v=>v!=null);
    const titulo = `${g.titulo} de ${dev}` + (vals.length ? `: de ${g.etq(vals[0])} a ${g.etq(vals[vals.length-1])} en ${r.horas} h` : ': sin datos') +
      (conAnclas && enVentana.length ? `; ${enVentana.length} anclas de madrugada` : '');
    geos[g.campo] = geo;
    partes.push(`<div class="g-tit"><i class="lk lk-${g.campo}"></i>${esc(g.titulo)}</div>` +
      svgGrafica({ campo:g.campo, serie, franjas, anclas: conAnclas ? anclas : [], geo, dom, maxGapMs:huecoSerieMs(r), etiqueta:g.etq, titulo,
                   idRayas:`rayas-${idSeguro(dev)}-${g.campo}`,
                   ticksX:ticksTiempo({ desde, hasta, medianoche, anchoPlot:geo.x1-geo.x0, zona:r.zona }) }));
  }
  return { html: partes.join('') + '<div class="tip" role="status" hidden></div>', geos };
}
function htmlTip(p, fr, zona, an){

    `<div class="tip-r"><i class="lk lk-pct"></i><b>${pct==null ? (p.pct===-1 ? 'sin celda' : '—') : fmtNum(pct,0)+' %'}</b><span>% de batería</span></div>`+
    `<div class="tip-r"><i class="lk lk-mv"></i><b>${fmtV(mv)}</b><span>voltaje</span></div>`+
    `<div class="tip-e">${cg.ic} ${esc(cg.txt)}${cl ? ` · ${cl.ic} ${esc(cl.largo)}` : ''}</div>`+
    (an ? `<div class="tip-e">${an.valida ? '◆' : '◇'} ancla del ${esc(fmtTiempo(esNum(an.salida) ? an.salida : an.t, zona, 'dia'))}: `+
          `<b>${fmtV(an.mv)}</b> (mediana de ${fmtNum(an.n,0)})${an.valida ? '' : ' · de un día que no cuenta'}</div>` : '');
}
function htmlTablaSerie(serie, zona, franjas){   // la tabla alternativa de las dos gráficas (lo más nuevo arriba)
  const filas = [...(serie||[])].reverse().map(p=>{
    const pct = valorDe(p,'pct'), cg = cargadorDe(p.carga), fr = franjaEn(franjas, p.t), cl = fr ? claseDe(fr.fuente) : null;
    return `<tr><td>${esc(fmtTiempo(p.t, zona, 'completa'))}</td><td class="n">${pct==null ? (p.pct===-1 ? 'sin celda' : '—') : fmtNum(pct,0)+' %'}</td>`+
      `<td class="n">${fmtV(valorDe(p,'mv'))}</td><td>${cg.ic} ${esc(cg.txt)}</td><td>${cl ? `${cl.ic} ${esc(cl.largo)}` : '—'}</td></tr>`;
  }).join('');
  return `<div class="tabla-scroll alta"><table class="t t-serie"><thead><tr><th>Hora</th><th class="n">% de batería</th>`+
    `<th class="n">Voltaje</th><th>Cargador</th><th>Franja</th></tr></thead><tbody>${filas}</tbody></table></div>`;
}

// ── los días: válidos (solo panel), en curso y excluidos ──
function barraDelta(v, maxAbs){   // barra divergente chica: a la derecha sube, a la izquierda baja (el texto lleva el signo)
  if(!esNum(v)) return '';
  const w = Math.min(28, Math.abs(v)/Math.max(1e-9, maxAbs)*28), x = v>=0 ? 30 : 30-w;
  return `<svg class="nb" width="60" height="8" viewBox="0 0 60 8" aria-hidden="true"><line x1="30" x2="30" y1="0" y2="8" stroke="var(--ink-faint)" stroke-width="1"/>`+
    `<rect x="${r1(x)}" y="1" width="${r1(Math.max(w, 0.5))}" height="6" rx="1.5" fill="var(--serie-2)"/></svg>`;
}
function celdaAnclas(a, b, conSiguiente=true){
  const v = x => x && esNum(x.mv) ? fmtV(x.mv) : 'sin ancla';
  const n = [a, conSiguiente ? b : null].filter(Boolean).map(x=>esNum(x.n) ? fmtNum(x.n,0) : '—').join(' / ');
  const motivo = [a, conSiguiente ? b : null].find(x=>x && !esNum(x.mv) && x.motivo);
  return `<td class="n"><b>${v(a)} → ${conSiguiente ? v(b) : '…'}</b>${n ? `<div class="q">${n} reportes</div>` : ''}`+
    `${motivo ? `<div class="q">${esc(motivo.motivo)}</div>` : ''}</td>`;
}
// CE2-8: la cosecha en cuatro celdas (panel, luz, subida, «cargando sin subir»).
function celdasCosecha(k, zona){
  if(!k) return '<td class="n">—</td>'.repeat(4);
  const hay = esNum(k.panel_min) && Number(k.panel_min)>0;
  return `<td class="n"><b>${fmtMin(k.panel_min)}</b><div class="q">${hay && esNum(k.primera) ? `${fmtHora(k.primera, zona)}–${fmtHora(k.ultima, zona)}` : 'sin panel'}</div></td>`+
    `<td class="n"><b>${fmtFraccion(k.fraccion_luz)}</b>${esNum(k.luz_min) ? `<div class="q">de ${fmtMin(k.luz_min)} de sol</div>` : ''}</td>`+
    `<td class="n"><b>${fmtMv(k.subida_mv)}</b>${esNum(k.max_mv) ? `<div class="q">máx ${fmtV(k.max_mv)}</div>` : ''}</td>`+
    `<td class="n"><b>${fmtMin(k.sin_subir_min)}</b>${esNum(k.sin_subir_hasta) ? `<div class="q">hasta las ${fmtHora(k.sin_subir_hasta, zona)}</div>` : ''}</td>`;
}
// CE2-6 y R1 (revisión adversarial, 2026-10-15): en un día de meseta el servidor ya no manda mAh (los 8–40 mAh por mV se

function celdaMah(d){
  const aviso = t => `<div class="q warn-t" title="${esc(d.aviso_meseta||'')}">${t}</div>`;
  if(!esPar(d.mah)) return `<td class="n"><b>—</b>${d.meseta ? aviso('⚠ meseta: sin mAh') : ''}</td>`;
  return `<td class="n"><b>${fmtMah(d.mah)}</b><div class="q">IC ${fmtMah(d.mah_ic)}</div>${d.meseta ? aviso('⚠ meseta') : ''}</td>`;
}
// CE2-3/4/8: la tabla de los días VÁLIDOS (lo más nuevo arriba) con el día en curso encima. Los excluidos van en otra.

// ── la tarjeta de un collar ──
function htmlResumenEnergia(c, r){
  const s = c.resumen || {}, v = veredictoDe(s.veredicto);
  const prov = s.provisional ? `<span class="pill mute">provisional · ${fmtNum(s.dias_validos,0)} de ${fmtNum(par(r,'dias_tendencia_min',5),0)} días</span>` : '';
  return { pill:`<span class="pill ${v.k} grande">${v.ic} ${v.txt}</span>`, prov, txt: esc(s.texto || v.txt) };
}
const tile = (lbl, val, sub) => `<div class="m"><div class="m-lbl">${lbl}</div><div class="m-val">${val}</div>${sub ? `<div class="m-sub">${sub}</div>` : ''}</div>`;
// CE2-4/6/7: arriba de la tarjeta, Δ por día con su IC, la tendencia, el rango de mAh (ESTIMADO) y los días.
function htmlStatsEnergia(c, r){
  const s = c.resumen || {}, t = s.tendencia || {}, nV = esNum(s.dias_validos) ? Number(s.dias_validos) : 0;
  const base = s.base==='tendencia' ? `de la tendencia de ${fmtNum(nV,0)} días válidos`
             : s.base==='promedio' ? `promedio de ${nV===1 ? '1 día válido' : fmtNum(nV,0)+' días válidos'}: provisional`
             : 'sin días válidos todavía';
  const medio = esPar(t.ic_mv_dia) ? (t.ic_mv_dia[1]-t.ic_mv_dia[0])/2 : null;
  const ex = esNum(s.dias_excluidos) ? Number(s.dias_excluidos) : 0, cab = Number(s.dias_excluidos_cable)||0, sp = Number(s.dias_sin_panel)||0;
  const otros = Math.max(0, ex - cab - sp);
  const exTxt = ex ? `${fmtNum(ex,0)} excluidos: ${[cab && `${fmtNum(cab,0)} por cable`, sp && `${fmtNum(sp,0)} sin panel`, otros && `${fmtNum(otros,0)} sin datos`].filter(Boolean).join(', ')}`
                   : 'ningún día excluido';
  return `<div class="e-stats">`+
    tile('Δ por día', esNum(s.media_mv_dia) ? `${fmtSigno(s.media_mv_dia)}<span class="q">mV/día</span>` : '—',
      (esNum(s.media_mv_dia) ? `IC95${etqEst(r,'resumen.ic_mv_dia')}<div class="nw">${fmtIC(s.ic_mv_dia)}</div><div>${esc(base)}</div>` : esc(base)))+
    tile('Tendencia', esNum(t.mv_dia) && medio!=null ? `${fmtSigno(t.mv_dia)} ± ${fmtNum(medio)}<span class="q">mV/día</span>` : 'faltan días',
      esNum(t.mv_dia) ? `IC95${etqEst(r,'resumen.tendencia.ic_mv_dia')}<div class="nw">${fmtIC(t.ic_mv_dia)}</div><div>${fmtNum(t.anclas,0)} anclas`+
        `${esNum(t.tramos) && t.tramos>1 ? ` en ${fmtNum(t.tramos,0)} tramos` : ''}</div>` : esc(t.motivo || ''))+
    tile(`mAh por día${etqEst(r,'resumen.mah_dia')}`, esPar(s.mah_dia) ? `${fmtMah(s.mah_dia)}<span class="q">mAh</span>` : '—',
      (esPar(s.mah_dia) ? `IC${etqEst(r,'resumen.mah_ic_dia')}<div class="nw">${fmtMah(s.mah_ic_dia)} mAh</div><div>${fmtNum(parPar(r,'mah_por_mv',[8,40])[0],0)}–`+
        `${fmtNum(parPar(r,'mah_por_mv',[8,40])[1],0)} mAh por mV</div>` : '')+
      // R1: con alguna ancla en una meseta el servidor no manda mAh: se dice por qué.
      (s.meseta ? `<div class="e-aviso" title="${esc(s.aviso_meseta||'')}">⚠ meseta de la celda: ${esPar(s.mah_dia) ? 'el rango puede quedarse corto' : 'sin mAh'}</div>` : ''))+
    tile('Días', `${fmtNum(nV,0)}<span class="q">válidos</span>`, esc(exTxt))+
    `</div>`;
}
// CE2-8: la cosecha del ÚLTIMO día válido; sin días válidos, la de hoy (en curso, todavía no cuenta).

function textoErrorEnergia(e){
  const s = String(e && e.message || e || '');
  if(s==='401' || s==='403') return 'La sesión expiró o no vale: vuelve a entrar en el Panel.';
  if(s==='404') return 'El servidor todavía no tiene GET /energia/balance: falta desplegar CE2 (backend).';
  if(s==='429') return 'El servidor está limitando las peticiones (429): espera unos minutos.';
  return `No se pudo traer la energía del servidor (${s || 'error de red'}).`;
}

// (En modo simulado, tools/servir_tablero.js reescribe esta línea para entrar con la sesión de prueba: que siga en una línea.)
function leerToken(){ try{ return localStorage.getItem('lindero_token'); }catch(e){ return null; } }
// meta (opcional, revisión adversarial 2, 2026-10-14): si se pasa un objeto, api() le pone `cache` = true cuando la
//  respuesta es la copia guardada de sw.js (sin red responde 200 con la cabecera X-Lindero-Cache). Los demás llamadores
//  no pasan nada y no cambian.
async function api(path, meta){
  const r = await fetch(API_BASE+path, { headers:{ 'Authorization':'Bearer '+TOKEN } });
  if(!r.ok) throw new Error(r.status);
  if(meta) meta.cache = !!(r.headers && typeof r.headers.get==='function' && r.headers.get('X-Lindero-Cache'));
  return r.json();
}
async function cargar(){

  try{
    const [cols, salud, alertas] = await Promise.all([ api('/collares'), api('/salud?limit=200').catch(()=>[]), api('/alertas?limit=80').catch(()=>[]) ]);
    collares = (cols||[]).map(mapCollar);
    // enriquecer con salud (uptime, entrega, reinicios) + sparkline de batería
    const saludPorDev={}; (salud||[]).forEach(s=>{ (saludPorDev[s.device]=saludPorDev[s.device]||[]).push(s); });
    collares.forEach(c=>{ const h=(saludPorDev[c.device]||[]); c.entrega=h[0]?.entrega_pct; c.uptime=h[0]?.uptime_min;
      c.batSerie=h.slice(0,20).reverse().map(x=>num(x.bateria)).filter(x=>x!=null); });
    eventos = construirEventos(alertas, collares);
    DEMO=false; conState(true, `En vivo · ${collares.length} collares`);
    pintar();
  }catch(e){
    usarDemo('No se pudo conectar con el servidor — mostrando datos de ejemplo.');
  }
}
function mapCollar(c){
  return { device:c.device, nombre:c.nombre||c.device, lote:c.lote_nombre,
    lat:num(c.lat), lng:num(c.lng), estado:c.estado||'ok',
    ts:c.ts?new Date(c.ts).getTime():null,
    sats:num(c.sats), hdop:num(c.hdop), snr:num(c.snr), rssi:num(c.rssi),
    speed:num(c.speed), movimiento:c.movimiento, bateria:num(c.bateria), carga:num(c.carga),
    dist:num(c.dist_borde), firmware:c.firmware, reinicios:num(c.reinicios_anormales),
    bloqueado:c.bloqueado, shock_pwr:num(c.shock_pwr), batSerie:[] };
}
function construirEventos(alertas, cols){
  const ev=(alertas||[]).map(a=>{
    const tipo = a.tipo==='shock'?'shock':a.tipo==='aviso'||a.tipo==='warn'?'warn':a.tipo==='bloqueo'?'reinicio':'info';
    const k = tipo==='shock'?'bad':tipo==='warn'?'warn':tipo==='reinicio'?'info':'ok';
    return { ts:a.ts?new Date(a.ts).getTime():Date.now(), tipo, k, dev:a.device,
      ic: tipo==='shock'?'⛔':tipo==='warn'?'▲':tipo==='reinicio'?'⟳':'●',
      msg:a.mensaje||a.tipo, conteo:a.conteo }; });
  // sumar "sin señal" como eventos derivados
  (cols||[]).forEach(c=>{ if(c.ts && !enLinea(c)) ev.push({ ts:c.ts, tipo:'offline', k:'mute', dev:c.device, ic:'○', msg:`${c.nombre} sin señal` }); });
  return ev.sort((a,b)=>b.ts-a.ts);
}

async function cargarEnergia({forzar=false}={}){
  // La copia guardada (sin red) se reintenta como un error: al minuto, no a los 5 (revisión adversarial 2, 2026-10-14).
  const espera = ENERGIA.error || ENERGIA.cache ? ENERGIA_REINTENTO_MS : ENERGIA_REFRESCO_MS;
  const vigente = ENERGIA.horasIntento===ENERGIA.horas && (Date.now()-ENERGIA.tsIntento) < espera;
  if(!forzar && (vigente || ENERGIA.cargando)){ actualizarEstadoEnergia(); pintarGraficasSiCambio(); return; }
  TOKEN = leerToken();
  ENERGIA.tsIntento = Date.now(); ENERGIA.horasIntento = ENERGIA.horas;
  if(!TOKEN){
    ENERGIA.datos=null; ENERGIA.ts=0; ENERGIA.cache=false; ENERGIA.error='Sin sesión: entra en el Panel (← Panel) y vuelve. Esta pestaña no usa datos de ejemplo.';
    renderEnergia(); return;
  }
  const yo = ++ENERGIA.pedido, horas = ENERGIA.horas;
  ENERGIA.cargando = true; actualizarEstadoEnergia();
  try{
    const meta = {};
    const d = await api('/energia/balance?horas='+horas, meta);
    if(yo!==ENERGIA.pedido) return;   // la reemplazó otra petición (cambió el rango)
    if(!d || typeof d!=='object' || !d.collares || typeof d.collares!=='object') throw new Error('respuesta sin collares');
    // La antigüedad es la del servidor (`generado`), no la del fetch: la copia de sw.js llega «ahora» pero es de antes.
    ENERGIA.datos=d; ENERGIA.horasDatos=horas; ENERGIA.ts=tsDeRespuesta(d, Date.now()); ENERGIA.cache=!!meta.cache; ENERGIA.error=null;
  }catch(e){
    if(yo!==ENERGIA.pedido) return;
    ENERGIA.error = textoErrorEnergia(e);
  }finally{
    if(yo===ENERGIA.pedido) ENERGIA.cargando=false;
  }
  renderEnergia();
}
// El estado y los avisos (error, copia sin red, datos viejos, otro rango) se recalculan en cada tick: la antigüedad

  const e=document.getElementById('e-estado'), g=document.getElementById('e-grid'), d=ENERGIA.datos;
  g.classList.toggle('recargando', ENERGIA.cargando && !!d);
  // CE2-9: `version` = la de los datos que se ven; sin la 2, el aviso «falta desplegar CE2».
  const o = { error:ENERGIA.error, hayDatos:!!d, ts:ENERGIA.ts, cache:ENERGIA.cache, horasDatos:ENERGIA.horasDatos,
              horasPedidas:ENERGIA.horas, cargando:ENERGIA.cargando, ahora:Date.now(), zona:d && d.zona, version:d ? d.version : undefined };
  e.textContent = textoEstadoEnergia(o);
  document.getElementById('e-aviso').innerHTML = avisosEnergia(o).map(t=>`<div class="e-banner">⚠ ${esc(t)}</div>`).join('');
}

// Las gráficas se arman al ancho real de su caja (el texto no se deforma) y se rehacen si el ancho cambia.

// Cursor: retícula vertical en las dos gráficas a la vez y un solo globo con todos los valores de ese momento.
//  Ratón, dedo (arrastre horizontal; el vertical desplaza la página) y teclado (← → Inicio Fin, Mayús = 12 pasos).
function engancharCursor(el){
  if(el._cursor) return; el._cursor = true;
  let idx = -1;
  // CE2: con v2 el globo también dice la clase de la franja (panel o cable) y el ancla de madrugada bajo el cursor
  //  (tolerancia de medio paso: la serie llega decimada y el ancla dura 50 min).
  const datos = ()=>{ const d=ENERGIA.datos, c=d && d.collares[el.dataset.dev]; return c && ENERGIA.geos[el.dataset.dev]
    ? { c, geos:ENERGIA.geos[el.dataset.dev], zona:d.zona, v2:esV2(d), tol:huecoSerieMs({ hueco_max_min:0, paso_min:d.paso_min })/2 } : null; };
  const ocultar = ()=>{ idx=-1; el.querySelectorAll('.cruz,.cruz-pt').forEach(n=>n.setAttribute('visibility','hidden')); const tp=el.querySelector('.tip'); if(tp) tp.hidden=true; };
  const mostrar = (i, svgActivo)=>{   // el globo va junto a la gráfica que se está tocando (la otra puede no verse)
    const x = datos(); if(!x || i<0 || i>=x.c.serie.length) return ocultar();
    idx = i; const p = x.c.serie[i]; let ref = null;
    for(const svg of el.querySelectorAll('svg.eg')){
      const g = x.geos[svg.dataset.campo]; if(!g) continue;
      const px = g.x(p.t), v = valorDe(p, svg.dataset.campo), ln = svg.querySelector('.cruz'), pt = svg.querySelector('.cruz-pt');
      ln.setAttribute('x1', px); ln.setAttribute('x2', px); ln.setAttribute('visibility', 'visible');
      if(v==null) pt.setAttribute('visibility', 'hidden');
      else { pt.setAttribute('cx', px); pt.setAttribute('cy', g.y(v)); pt.setAttribute('visibility', 'visible'); }
      if(!ref || svg===svgActivo) ref = { svg, px, g };
    }
    const tp = el.querySelector('.tip'); if(!tp || !ref) return;
    tp.innerHTML = htmlTip(p, x.v2 ? franjaEn(x.c.franjas, p.t) : null, x.zona, x.v2 ? anclaEn(anclasDe(x.c), p.t, x.tol) : null); tp.hidden = false;
    // (un <svg> no tiene offsetLeft/offsetTop: la posición sale de los rectángulos)
    const er = el.getBoundingClientRect(), sr = ref.svg.getBoundingClientRect(), k = sr.width / (ref.g.ancho || 1);
    const xEl = sr.left - er.left + ref.px*k, w = tp.offsetWidth;
    let left = xEl + 14; if(left + w > el.clientWidth) left = Math.max(0, xEl - 14 - w);
    tp.style.left = left+'px'; tp.style.top = (sr.top - er.top + ref.g.y0*k)+'px';
  };
  const alPuntero = e=>{
    const svg = e.target.closest && e.target.closest('svg.eg'), x = datos(); if(!svg || !x) return;
    const g = x.geos[svg.dataset.campo], r = svg.getBoundingClientRect(); if(!g || !r.width) return;
    const px = (e.clientX - r.left) * (g.ancho / r.width);
    if(px < g.x0-6 || px > g.x1+6) return ocultar();
    mostrar(indiceCercano(x.c.serie, g.t(px)), svg);
  };
  el.addEventListener('pointermove', alPuntero);
  el.addEventListener('pointerdown', alPuntero);   // un toque en el teléfono también lo muestra
  // Con el dedo, pointerleave llega al levantarlo: el globo se queda hasta tocar fuera (lo quita el document).
  el.addEventListener('pointerleave', e=>{ if(e.pointerType!=='touch') ocultar(); });
  el._ocultar = ocultar;
  el.addEventListener('blur', ocultar);
  // Con teclado (Tab) arranca en el último punto; un clic o toque ya mostró su propio punto.
  el.addEventListener('focus', ()=>{ let tec=true; try{ tec=el.matches(':focus-visible'); }catch(e){} const x=datos(); if(x && tec) mostrar(x.c.serie.length-1); });
  el.addEventListener('keydown', e=>{
    const x = datos(); if(!x || !x.c.serie.length) return;
    const n = x.c.serie.length, salto = e.shiftKey ? 12 : 1; let i = idx<0 ? n-1 : idx;
    if(e.key==='ArrowLeft') i = Math.max(0, i-salto); else if(e.key==='ArrowRight') i = Math.min(n-1, i+salto);
    else if(e.key==='Home') i = 0; else if(e.key==='End') i = n-1;
    else if(e.key==='Escape'){ ocultar(); return; } else return;
    e.preventDefault(); mostrar(i);
  });
}
